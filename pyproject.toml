# QAX packaging. Install from a checkout (keeps config/, web/static and the demo targets in place):
#     python3.12 -m venv .venv && . .venv/bin/activate
#     pip install -e .            # then: qax doctor · qax demo · qax-web
#     python -m playwright install chromium
# `make install` does the same into .venv-exec.
# A wheel (`pip install .`) also works: run `qax` / `qax-web` from a work folder — QAX writes
# output/ and config/projects/ there (core/paths.py), never into site-packages.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qax"
version = "0.1.0"
description = "QAX — the runtime proof layer: generate the tests, prove the bugs, ship to Jira."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",       # floors = the audited versions (strategy/evidence/DEPENDENCY_AUDIT.md)
    "jsonschema>=4.23.0",
    "requests>=2.34.2",
    "urllib3>=2.0",              # imported directly (core/session_auth.py)
    "playwright==1.44.0",
    "flask>=3.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio==1.4.0", "pytest-cov>=5", "pip-audit>=2.7", "PyJWT>=2.8"]
visual = ["Pillow>=10"]          # the scan's screenshot visual regression (services/visual_regression.py)
yaml = ["PyYAML>=6"]             # YAML OpenAPI specs (services/live_surface.py)

[project.scripts]
qax = "main:main"
qax-web = "web.server:serve"

[tool.setuptools]
py-modules = ["main"]
# Explicit list (tests/test_packaging.py checks it against every __init__.py) so the two
# data-only packages below can map onto the repo's config/ and configs/ folders.
packages = [
    "core", "core.adapters", "core.input_adapters",
    "services", "execution", "web", "cli", "evals", "evals.targets",
    "qax_config", "qax_configs",
]

[tool.setuptools.package-dir]
qax_config = "config"     # read via core/paths.py when there is no repo root (wheel install)
qax_configs = "configs"

# Everything a shipped command reads at runtime. Never config/projects/ (per-user app maps,
# selectors) or anything secret — those stay in the checkout.
[tool.setuptools.package-data]
core = ["vendor/axe-core/*"]   # axe-core 4.13.0, MPL-2.0, unmodified — with its LICENSE files
web = ["static/*.html", "static/*.js", "static/*.css", "static/img/*"]
evals = ["truth/*.json", "data/*.json", "data/*.jsonl"]   # qax demo + the gate
qax_config = ["system_prompt.md", "xray_schema.json"]   # read-only; what QAX writes goes to core.paths.data_root()
qax_configs = ["*.json"]
