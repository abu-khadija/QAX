# ─────────────────────────────────────────────────────────────────────────────
# QAX — GitHub Actions: Security scan on Pull Request (PR gate)
# ─────────────────────────────────────────────────────────────────────────────
# On every PR: scan a RUNNING copy of the app (a preview deployment, or one started in
# this job), comment the CONFIRMED findings on the PR, and fail the check when a confirmed
# P1/P2 is found. AI suspicions are shown separately as leads and never block.
#
# The comment is honest about what it did NOT check: a clean result is never called clean
# while checks could not run (a NOT TESTED section says which, and what would unblock them),
# flaky hits are shown as UNSTABLE, and any test records QAX could not remove are listed.
#
# No API key is needed for the default (quick, live-app) scan.
#
# Setup:
#   1. Copy this file to .github/workflows/qax-scan.yml
#   2. Set the repo VARIABLE  QAX_TARGET_URL  to the app's URL (only apps you are allowed
#      to test), or edit "Start the app under test" to boot it inside the job.
#   3. Recommended — add secrets QAX_TOKEN (a valid token) and QAX_TOKEN_B (a SECOND,
#      ordinary user's token): they enable the authenticated probes (BOLA, BFLA, stale
#      access after revocation, ...). Without them those checks are listed as NOT TESTED.
#   4. Optional variable  QAX_REQUIRE_PROBES  (e.g. "bola,bfla"): fail the check if one of
#      those probes could not run, so a green check can never mean "it didn't run".
# ─────────────────────────────────────────────────────────────────────────────

name: QAX — Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # to post the findings comment

jobs:
  qax-scan:
    name: QAX security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install QAX dependencies (lean scanner set)
        run: |
          pip install --upgrade pip
          pip install -r requirements-scan.txt

      # ── Start YOUR app under test, then expose its URL as QAX_TARGET_URL ──
      # Replace this with however your app boots (docker compose, a run command,
      # a deployed preview URL, …). The probes run against this URL.
      - name: Start the app under test
        run: |
          # Example — adapt to your stack:
          #   docker compose up -d && sleep 10
          #   npm ci && npm start &
          echo "QAX_TARGET_URL=${QAX_TARGET_URL:-http://127.0.0.1:8000}" >> "$GITHUB_ENV"
          # Wait for the app to answer before scanning (max ~60s):
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "${QAX_TARGET_URL:-http://127.0.0.1:8000}"; then
              echo "app is up"; break
            fi
            sleep 2
          done
        env:
          QAX_TARGET_URL: ${{ vars.QAX_TARGET_URL }}

      - name: Run QAX scan
        id: scan
        continue-on-error: true
        env:
          DRY_RUN: 'true'
          LOG_LEVEL: 'WARNING'
          QAX_REPO: ''                      # empty = scan the live app only (needs no API key)
          QAX_FAIL_ON: 'P1,P2'
          QAX_REVERIFY: '1'                 # confirm only what reproduces on a second pass
          QAX_TOKEN: ${{ secrets.QAX_TOKEN }}
          QAX_TOKEN_B: ${{ secrets.QAX_TOKEN_B }}
          QAX_REQUIRE_PROBES: ${{ vars.QAX_REQUIRE_PROBES }}
        run: |
          set +e
          python -m ci.pr_scan
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment findings on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try { body = fs.readFileSync('pr_comment.md', 'utf8'); }
            catch (e) { body = '## 🛡️ QAX security scan\n\nNo report produced.'; }
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('QAX security scan')) {
                await github.rest.issues.deleteComment({
                  comment_id: c.id, owner: context.repo.owner, repo: context.repo.repo,
                });
              }
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body,
            });

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qax-scan
          path: |
            pr_comment.md
            output/qax_scan.json
          retention-days: 7

      # ── Fail the check when QAX proved a blocking issue ──────────────────
      - name: Gate on confirmed findings
        if: always()
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "QAX found confirmed P1/P2 issue(s) — failing the check."
            exit 1
          fi
          echo "QAX: no blocking issues."
