# ─────────────────────────────────────────────────────────────────────────────
# QAX — GitHub Actions: Auto-Generate Test Cases on Pull Request
# ─────────────────────────────────────────────────────────────────────────────
# Triggers on every PR open or update. Analyzes changed .cs files with Claude,
# then posts a summary comment on the PR with the generated test cases.
#
# Required GitHub secret:
#   ANTHROPIC_API_KEY — your Anthropic API key
#   (Jira/Xray not needed — DRY_RUN=true, no API calls made)
#
# Usage:
#   1. Copy this file to .github/workflows/qax.yml
#   2. Add ANTHROPIC_API_KEY to GitHub repo secrets
#   3. Open or update a Pull Request — the agent runs automatically
# ─────────────────────────────────────────────────────────────────────────────

name: QAX — Auto Generate

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-tests:
    name: Generate Test Cases
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the PR branch ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Full history needed for git_analyzer

      # ── 2. Set up Python 3.11 ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Find changed .cs files in this PR ─────────────────────────────
      - name: Find changed files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.cs$' \
            | head -20 \
            > changed_files.txt
          echo "Changed .cs files:"
          cat changed_files.txt
          echo "count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      # ── 5. Generate test cases (DRY_RUN — no Xray/Jira calls) ────────────
      - name: Generate test cases
        if: steps.changed.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: 'true'
          LOG_LEVEL: 'WARNING'
        run: |
          # Read each changed file and generate test cases
          OUTPUT_FILE="output/pr_test_cases.json"
          mkdir -p output

          while IFS= read -r filepath; do
            if [ -f "$filepath" ]; then
              echo "Analyzing: $filepath"
              python main.py analyze \
                --file "$filepath" \
                --dry-run \
                --output "$OUTPUT_FILE" 2>/dev/null || true
            fi
          done < changed_files.txt

      # ── 6. Generate PR comment markdown ──────────────────────────────────
      - name: Generate PR comment
        if: steps.changed.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: 'true'
        run: |
          python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          output_file = Path("output/pr_test_cases.json")
          changed_file = Path("changed_files.txt")

          changed_files = []
          if changed_file.exists():
              changed_files = [l.strip() for l in changed_file.read_text().splitlines() if l.strip()]

          test_cases = []
          if output_file.exists():
              try:
                  test_cases = json.loads(output_file.read_text(encoding="utf-8"))
                  if not isinstance(test_cases, list):
                      test_cases = []
              except Exception:
                  test_cases = []

          try:
              sys.path.insert(0, ".")
              from core.markdown_reporter import generate_pr_comment
              comment = generate_pr_comment(test_cases, changed_files)
          except Exception as e:
              comment = f"## QAX\n\nError generating report: {e}\n"

          Path("pr_comment.md").write_text(comment, encoding="utf-8")
          print(f"Comment generated: {len(test_cases)} test cases for {len(changed_files)} files")
          PYEOF

      # ── 7. Post comment on PR ─────────────────────────────────────────────
      - name: Comment on PR
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment;
            try {
              comment = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              comment = '## QAX\n\nNo test cases generated (no testable .cs files changed).';
            }

            // Delete previous bot comments to avoid spamming the PR
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' &&
                  c.body.includes('QAX')) {
                await github.rest.issues.deleteComment({
                  comment_id: c.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              }
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

      # ── 8. No .cs files changed ───────────────────────────────────────────
      - name: Skip (no .cs files changed)
        if: steps.changed.outputs.count == '0'
        run: echo "No .cs files changed in this PR — skipping test generation."

      # ── 9. Upload output as artifact ──────────────────────────────────────
      - name: Upload generated test cases
        if: steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v3
        with:
          name: generated-test-cases
          path: output/
          retention-days: 7
